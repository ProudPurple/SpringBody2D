name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            artifact-name: springbody2d-linux-x86_64

          - name: macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal
            artifact-name: springbody2d-macos-universal

          - name: Windows (x86_64)
            os: windows-latest
            platform: windows
            arch: x86_64
            artifact-name: springbody2d-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      - name: Build (debug)
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug

      - name: Build (release)
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: addons/springbody2d/bin/
          if-no-files-found: error

  release:
    name: Attach binaries to release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble addon package
        run: |
          cp -r artifacts/springbody2d-linux-x86_64/.   addons/springbody2d/bin/
          cp -r artifacts/springbody2d-macos-universal/. addons/springbody2d/bin/
          cp -r artifacts/springbody2d-windows-x86_64/.  addons/springbody2d/bin/
          zip -r springbody2d.zip addons/springbody2d/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} springbody2d.zip --repo ${{ github.repository }}
