name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run tests
        run: g++ -std=c++17 tests/test_spring.cpp -o /tmp/test_runner && /tmp/test_runner

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (x86_64)
            os: ubuntu-22.04
            platform: linux
            arch: x86_64
            artifact-name: springbody2d-linux-x86_64

          - name: macOS (universal)
            os: macos-latest
            platform: macos
            arch: universal
            artifact-name: springbody2d-macos-universal

          - name: Windows (x86_64)
            os: windows-latest
            platform: windows
            arch: x86_64
            artifact-name: springbody2d-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install SCons
        run: pip install scons

      # Caches the compiled godot-cpp AND .sconsign.dblite, the file where SCons records what
      # it already built. Without that file a restored godot-cpp gets recompiled anyway.
      # The key includes the build profile, so editing build_profile.json rebuilds godot-cpp.
      - name: Cache godot-cpp
        id: godot-cpp-cache
        uses: actions/cache@v4
        with:
          path: |
            godot-cpp
            .sconsign.dblite
          key: godot-cpp-4.5-v2-${{ matrix.platform }}-${{ matrix.arch }}-${{ hashFiles('build_profile.json') }}

      - name: Get godot-cpp
        if: steps.godot-cpp-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 4.5 https://github.com/godotengine/godot-cpp.git godot-cpp

      # No separate godot-cpp build step: the SConstruct below builds godot-cpp itself, and a
      # separate build keeps its own records, so its work was never reused.
      # build_profile.json limits godot-cpp to the classes the plugin uses.
      - name: Build (debug)
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_debug build_profile=build_profile.json

      - name: Build (release)
        run: scons platform=${{ matrix.platform }} arch=${{ matrix.arch }} target=template_release build_profile=build_profile.json

      # Upload only this platform's binaries. Uploading the whole bin/ folder also uploaded the
      # stale copies of the other platforms' binaries already committed in the repo, and when
      # the artifacts were merged the Windows one (copied last) overwrote the fresh Linux and
      # macOS binaries with those stale copies.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            addons/springbody2d/bin/libspringbody.${{ matrix.platform }}.*
            !addons/springbody2d/bin/*.lib
            !addons/springbody2d/bin/*.exp
          if-no-files-found: error

  commit-binaries:
    name: Commit binaries to repo
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Copy binaries into addon
        run: |
          cp -r artifacts/springbody2d-linux-x86_64/.   addons/springbody2d/bin/
          cp -r artifacts/springbody2d-macos-universal/. addons/springbody2d/bin/
          cp -r artifacts/springbody2d-windows-x86_64/.  addons/springbody2d/bin/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add addons/springbody2d/bin/
          git diff --staged --quiet || git commit -m "chore: update pre-built binaries [skip ci]"
          git push

  release:
    name: Attach binaries to release
    runs-on: ubuntu-latest
    needs: [build, test]
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Assemble addon package
        run: |
          cp -r artifacts/springbody2d-linux-x86_64/.   addons/springbody2d/bin/
          cp -r artifacts/springbody2d-macos-universal/. addons/springbody2d/bin/
          cp -r artifacts/springbody2d-windows-x86_64/.  addons/springbody2d/bin/
          zip -r springbody2d.zip addons/springbody2d/

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload ${{ github.event.release.tag_name }} springbody2d.zip --repo ${{ github.repository }}